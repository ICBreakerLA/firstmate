# Path-filtered stock macOS Bash compatibility job, kept alongside ci.yml's own macOS job.
#
# The local gate cannot supply macOS's stock Bash 3.2.57 (CONTRIBUTING.md "Hosted
# CI and the local gate"), so this job keeps that coverage. It runs only when a
# pull request touches shell portability, and on demand; tests/fm-macos-workflow.test.sh guards the trigger shape.
name: macOS Bash compatibility

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its in-flight macOS run.
concurrency:
  group: macos-bash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

          shell_inventory="$RUNNER_TEMP/fm-shell-inventory"
          bin/fm-lint.sh --list-files > "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          command -v npm >/dev/null || { echo "::error::npm is required to install tasks-axi"; exit 1; }
          npm install -g tasks-axi@0.2.6 >/dev/null
          PATH="$(npm prefix -g)/bin:$PATH"
          export PATH
          command -v tasks-axi >/dev/null || { echo "::error::tasks-axi is required for the stock Bash regressions"; exit 1; }

          # Each suite declares its own TAP plan; the helper fails an early
          # exit 0 that does not reach FM_TEST_COMPLETE or whose ok count
          # disagrees with the plan. Per-suite totals live in the test files.
          /bin/bash bin/fm-test-tap-verify.sh tests/fm-fleet-snapshot-view.test.sh
          /bin/bash bin/fm-test-tap-verify.sh tests/fm-bearings-snapshot.test.sh

          # The full public-followup suite is not a stock-bash snapshot; run only
          # the empty-lock register regression under real /bin/bash 3.2.
          FM_TEST_STOCK_BASH=1 /bin/bash bin/fm-test-tap-verify.sh \
            tests/fm-public-followup.test.sh

          # Same shape for the watcher's churn-deferral regression: an already-
          # marked churn window expands an empty array that only stock Bash
          # treats as an unbound variable under set -u.
          FM_TEST_STOCK_BASH=1 /bin/bash bin/fm-test-tap-verify.sh \
            tests/fm-watch-triage.test.sh

          # The fork-free hot-path helpers must stay byte-identical to the
          # commands they replace under stock Bash 3.2, which lacks the
          # printf %(...)T clock and falls back to date.
          /bin/bash bin/fm-test-tap-verify.sh tests/fm-fork-free-helpers.test.sh

          FM_TEST_STOCK_BASH=1 FM_TEST_BASH=/bin/bash \
            /bin/bash bin/fm-test-tap-verify.sh tests/fm-backend.test.sh

          # The launch-env-allowlist wrapper executes in the pane's own shell
          # on macOS, where /bin/sh, /bin/bash and /bin/zsh are all present.
          allowlist_output=$(FM_TEST_ONLY=test_launch_environment_allowlist \
            /bin/bash tests/fm-spawn-dispatch-profile.test.sh)
          printf '%s\n' "$allowlist_output"
          allowlist_count=$(printf '%s\n' "$allowlist_output" | grep -c '^ok - ')
          [ "$allowlist_count" -eq 4 ] || {
            echo "::error::expected 4 launch-env-allowlist regressions, got $allowlist_count"
            exit 1
          }
