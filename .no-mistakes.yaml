# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# gate-context lifecycle boundary (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the repository's canonical owner instead of leaving it to
# no-mistakes' default handling, which does not invoke that gate.
# `bin/fm-lint.sh` owns the context-sensitive ShellCheck modes and GitHub
# workflow lint via pinned actionlint in `bin/fm-lint-workflows.sh`.
# Invocation wiring is asserted by `tests/fm-lint.test.sh` and
# `tests/fm-lint-workflows.test.sh`.
#
# The output scan runs first so it still runs when the lint tools cannot (a sandbox
# without ShellCheck); it checks only the lines the branch adds, never a manual gate.
# Strict dual-SDK compilation belongs to this compiler-owning phase, not Test.
# The existing type-regression owner also runs in the portable serial lane.
#
# The local no-mistakes gate owns broad deterministic regression. The coverage guard
# plus the three portable lanes below, composed by their single owner
# `bin/fm-test-run.sh`, cover the whole deterministic portable suite, including
# `tests/fm-repo-invariants.test.sh` and the hermetic `tests/fm-backend-hc.test.sh`.
# The real-Herdr family, the pinned hc family, and the live-harness opt-in family
# deliberately stay out: every lane excludes live-harness-optin and hc-pinned, and
# FM_LIVE=0 stops any remaining default-on fm_live_gate guard, so a gate round never
# drives a live Herdr session, uses a real hc binary, or downloads release binaries,
# and `--all` is never selected. This fork runs no hosted Linux suite;
# `.github/workflows/macos-bash.yml` keeps only the path-filtered stock macOS Bash
# check, and CONTRIBUTING.md "Fork divergence: no hosted Linux suite" owns the reason
# and the sync rule.
#
# The full portable walk takes roughly 3.5-4 hours. The operator raised the host's
# global no-mistakes `test_agent_timeout` to 5h on 2026-11-16; no-mistakes reads
# that key only from its global config, so a copy in this file is ignored.
commands:
  lint: 'bin/fm-output-scan.sh --diff && bin/fm-lint.sh && bash tests/fm-pi-primary-types.test.sh'
  test: 'FM_LIVE=0 bin/fm-test-run.sh --check-coverage && FM_LIVE=0 bin/fm-test-run.sh --lane portable-parallel-1 --exclude-family live-harness-optin --exclude-family hc-pinned && FM_LIVE=0 bin/fm-test-run.sh --lane portable-parallel-2 --exclude-family live-harness-optin --exclude-family hc-pinned && FM_LIVE=0 bin/fm-test-run.sh --lane portable-serial --exclude-family live-harness-optin --exclude-family hc-pinned'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  instructions: |
    commands.test runs the complete deterministic portable suite: the coverage guard, both portable parallel lanes, and the portable serial remainder, which includes the repo invariants test.
    That run is the Test evidence; do not walk the suite again.
    The real-Herdr and pinned hc families and the live-harness opt-in family deliberately stay out: every lane excludes live-harness-optin and hc-pinned, and FM_LIVE=0 stops any remaining default-on guard, so a gate round never drives a live Herdr session, uses a real hc binary, or downloads release binaries; record a capability-skipped family as untested in one line.
    Add a scenario beyond that suite only when no deterministic test reaches the behavior: run a new regression once against the base to see it fail and once against the change to see it pass, then move on; do not repeat a proof a deterministic test already gives.
    Start a live scenario only when the diff changes launch, lifecycle, or harness behavior that no deterministic test can reach.
    Before starting one, check that its tools exist here (tmux, herdr, the harness CLI). When one is absent, as in a sandboxed ship, record that scenario as untested in one line and go on; never probe for a workaround or build a stand-in.
    Run live Herdr scenarios only through bin/fm-herdr-lab.sh with a named non-default fm-lab-* session, following that helper's prepare, provision, run, and teardown contract exactly.
    Never touch the live default Herdr session or fleet panes.
    Prefer a throwaway lab for spawn, long-launch, and Claude-path proofs, and tear it down in the same evidence turn.
    To run a real primary inside the gate, mint a disposable lab home: `LAB=$(mktemp -d "${TMPDIR:-/tmp}/fm-lab.XXXXXX")` then `bin/fm-lab-home.sh create "$LAB"` and `mkdir -p "$LAB/tmux"`; write the scenario's opt-in flag (e.g. `touch "$LAB/config/supervision-host"`), and remove the lab in the same evidence turn with `rm -rf "$LAB"`. Lifecycle calls against any other home stay refused.
    Start the harness CLI as the session command on the lab's private tmux socket, from the run worktree: `env -u NO_MISTAKES_GATE -u FM_GATE_REFUSE_BYPASS -u FM_ROOT_OVERRIDE -u FM_STATE_OVERRIDE -u FM_DATA_OVERRIDE -u FM_CONFIG_OVERRIDE -u FM_PROJECTS_OVERRIDE TMUX_TMPDIR="$LAB/tmux" tmux -L fm-lab new-session -d -s primary -c "$PWD" -e FM_HOME="$LAB" <cli>`, where <cli> is the harness's own launch command using the machine's existing login: claude -> `claude`, codex -> `codex`, cursor -> `cursor-agent`, opencode -> `opencode`, grok -> `grok`, omp -> `omp`. Drive, inspect, and stop that primary only through the same socket - `TMUX_TMPDIR="$LAB/tmux" tmux -L fm-lab send-keys -t primary ...`, `TMUX_TMPDIR="$LAB/tmux" tmux -L fm-lab capture-pane -p -t primary`, `TMUX_TMPDIR="$LAB/tmux" tmux -L fm-lab kill-server` - never the default tmux server; the firstmate scripts the primary runs inherit $TMUX from its pane, which names that same fm-lab socket inside the lab. The lab primary's scripts run from the gate worktree, whose git-common-dir triggers the gate check, and the marked lab home permits lifecycle without a bypass; the `env -u` list keeps inherited fleet-path overrides out of the fixture primary's environment so all paths resolve inside the lab. For a Herdr primary use a named non-default fm-lab-* session via bin/fm-herdr-lab.sh instead. If the harness CLI is absent or its login is unavailable, report the scenario untested; never fake the CLI, the login, or the evidence.
    Do not mutate the operator primary checkout, real fleet FM_HOME state, or production credentials (never sign in, sign out, re-login, or edit credential stores), and keep git changes otherwise inside the run worktree. A captain-opted-in live check may use the machine's normal Claude login; Claude's own session and transcript files under the home directory are expected and are not credential mutations. An empty isolated CLAUDE_CONFIG_DIR is not evidence that the normal login is unavailable.
    Read docs/herdr-backend.md and the bin/fm-herdr-lab.sh header as the owners of Herdr lab mechanics rather than reproducing that manual here.
    Ship or scout briefs that will drive Herdr lifecycle still require --herdr-lab at scaffold time; these Test-agent instructions are not a substitute for that brief flag.
  evidence:
    store_in_repo: true
